<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080d">
<title>النتيجة</title>
<style>
:root{
  --bg:#07070c;
  --card:#12121a;
  --card2:#171722;
  --text:#f5f3ff;
  --muted:#9d9aaa;
  --accent:#8d6cff;
  --accent2:#5c8dff;
  --green:#25c979;
  --border:rgba(255,255,255,.075);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}

/* Animated background */
body::before,body::after{
  content:"";position:fixed;inset:-25%;z-index:-3;pointer-events:none;
  background:
    radial-gradient(circle at 18% 25%,rgba(141,108,255,.20),transparent 28%),
    radial-gradient(circle at 82% 72%,rgba(92,141,255,.15),transparent 30%),
    radial-gradient(circle at 55% 45%,rgba(170,80,255,.07),transparent 24%);
  filter:blur(35px);
  animation:floatBg 16s ease-in-out infinite alternate;
}
body::after{
  z-index:-2;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent);
  opacity:.38;
  animation:gridMove 24s linear infinite;
}
@keyframes floatBg{from{transform:translate3d(-2%, -1%,0) scale(1)}to{transform:translate3d(3%,2%,0) scale(1.08)}}
@keyframes gridMove{from{transform:translate(0,0)}to{transform:translate(46px,46px)}}

header{
  position:sticky;top:0;z-index:10;
  padding:18px 16px 15px;
  text-align:center;
  background:rgba(7,7,12,.72);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}
h1{margin:0;font-size:25px;letter-spacing:.3px}
.subtitle{margin-top:5px;color:var(--muted);font-size:13px}

.grid{
  width:min(1250px,100%);
  margin:auto;
  padding:16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:10px;
}
.day{
  position:relative;
  min-height:145px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(25,25,35,.92),rgba(12,12,19,.92));
  box-shadow:0 8px 25px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.035);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  transition:transform .2s ease,border-color .25s ease,background .3s ease,box-shadow .3s ease;
}
.day::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(141,108,255,.055),transparent 42%,rgba(92,141,255,.035));
}
.day:active{transform:scale(.97)}
.day.passed{
  background:linear-gradient(145deg,rgba(21,91,62,.95),rgba(9,48,34,.96));
  border-color:rgba(37,201,121,.55);
  box-shadow:0 8px 25px rgba(10,100,65,.18),inset 0 1px 0 rgba(255,255,255,.06);
}
.day.passed::after{
  content:"✓";
  position:absolute;left:9px;bottom:7px;
  width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(37,201,121,.18);
  color:#68e5a6;font-size:15px;font-weight:800;
}
.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:6px}
.top{height:30px;color:#aaa6b7;font-size:11px}
.month{font-weight:750;color:#c7c2d8}
.week{color:#817b91}
.middle{
  height:65px;display:grid;place-items:center;
  border-top:1px solid rgba(255,255,255,.055);
  border-bottom:1px solid rgba(255,255,255,.055);
  font-size:16px;font-weight:800;
}
.bottom{height:30px;font-size:11px}
.greg{color:#ddd9e7;font-weight:700}
.hijri{color:#aaa5b5}
.hint{
  text-align:center;color:#777382;font-size:12px;
  padding:0 16px 22px;
}
@media(max-width:520px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
  .day{min-height:130px;padding:8px;border-radius:15px}
  .middle{height:57px;font-size:14px}
  h1{font-size:22px}
}
@media(min-width:900px){.day{min-height:155px}.middle{height:72px}}
</style>
</head>
<body>
<header>
  <h1>النتيجة</h1>
  <div class="subtitle">من 1 أغسطس 2026 إلى 20 يوليو 2027</div>
</header>

<main class="grid" id="grid"></main>
<div class="hint">اضغط ضغطة مطوّلة على أي يوم لتحويله إلى يوم مُنجز ✓</div>

<script>
const START = new Date(2026,7,1);
const END   = new Date(2027,6,20);

const months = [
  "يناير","فبراير","مارس","أبريل","مايو","يونيو",
  "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"
];
const weekdays = [
  "الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"
];

const hijriFormatter = new Intl.DateTimeFormat(
  "ar-SA-u-ca-islamic-umalqura-nu-latn",
  {day:"numeric",month:"numeric",year:"numeric"}
);

function keyFor(date){
  return date.toISOString().slice(0,10);
}

function shortYear(y){
  return String(y).slice(-2);
}

function getHijri(date){
  const parts = hijriFormatter.formatToParts(date);
  const d = parts.find(p=>p.type==="day")?.value || "";
  const m = parts.find(p=>p.type==="month")?.value || "";
  const y = parts.find(p=>p.type==="year")?.value || "";
  return `${d} / ${m} / ${shortYear(y)}`;
}

const saved = JSON.parse(localStorage.getItem("passedDays") || "{}");
const grid = document.getElementById("grid");

let current = new Date(START);
let index = 0;

while(current <= END){
  const d = current.getDate();
  const m = current.getMonth();
  const y = current.getFullYear();
  const key = keyFor(current);

  const card = document.createElement("article");
  card.className = "day" + (saved[key] ? " passed" : "");
  card.dataset.key = key;

  const top = document.createElement("div");
  top.className = "top";
  top.innerHTML = `
    <span class="month">${months[m]}</span>
    <span class="week">أسبوع ${Math.floor(index/7)+1}</span>
  `;

  const middle = document.createElement("div");
  middle.className = "middle";
  middle.textContent = weekdays[current.getDay()];

  const bottom = document.createElement("div");
  bottom.className = "bottom";
  bottom.innerHTML = `
    <span class="greg">${d} / ${m+1} / ${shortYear(y)}</span>
    <span class="hijri">${getHijri(current)}</span>
  `;

  card.append(top,middle,bottom);
  grid.appendChild(card);

  let timer = null;
  let longPressed = false;

  const startPress = (e) => {
    if(e.type === "mousedown" && e.button !== 0) return;
    longPressed = false;
    timer = setTimeout(() => {
      longPressed = true;
      togglePassed(card,key);
      if(navigator.vibrate) navigator.vibrate(35);
    }, 550);
  };

  const cancelPress = () => {
    if(timer){ clearTimeout(timer); timer=null; }
  };

  card.addEventListener("touchstart", startPress, {passive:true});
  card.addEventListener("touchend", cancelPress);
  card.addEventListener("touchcancel", cancelPress);
  card.addEventListener("mousedown", startPress);
  card.addEventListener("mouseup", cancelPress);
  card.addEventListener("mouseleave", cancelPress);

  current.setDate(current.getDate()+1);
  index++;
}

function togglePassed(card,key){
  const isPassed = card.classList.toggle("passed");
  if(isPassed) saved[key] = true;
  else delete saved[key];
  localStorage.setItem("passedDays",JSON.stringify(saved));
}
</script>
</body>
</html>
